name: Render Keep Alive 24/7

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier 15-minute sleep
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping-render:
    name: Ping Render Web Service
    runs-on: ubuntu-latest
    steps:
      - name: Ping GSRTC Live on Render
        run: |
          echo "Pinging Render service at $(date)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://gsrtc-live.onrender.com/api/health)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "Render service is awake and healthy!"
          else
            echo "Wake-up signal transmitted (Status $STATUS). Retrying in 10s..."
            sleep 10
            curl -s --max-time 30 https://gsrtc-live.onrender.com/api/health || true
          fi
