services:
  - type: web
    name: gsrtc-live
    runtime: python
    buildCommand: "pip install -r requirements.txt || true"
    startCommand: "python3 server.py"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: KEEP_ALIVE_URL
        value: https://gsrtc-live.onrender.com
